
<svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 1000 420"
>

    <defs>

        <linearGradient
            id="sky"
            x1="0"
            y1="0"
            x2="1"
            y2="1"
        >

            <stop
                offset="0%"
                stop-color="#dbeafe"
            />

            <stop
                offset="100%"
                stop-color="#ede9fe"
            />

        </linearGradient>

    </defs>


    <rect
        width="1000"
        height="420"
        rx="28"
        fill="url(#sky)"
    />


    <text
        x="50"
        y="65"
        font-size="34"
        font-family="Arial"
        font-weight="700"
        fill="#172033"
    >
        A Morning Full of Physics
    </text>


    <!-- PHONE -->

    <g>

        <rect
            x="80"
            y="135"
            width="115"
            height="190"
            rx="20"
            fill="#111827"
        />

        <rect
            x="95"
            y="155"
            width="85"
            height="125"
            rx="10"
            fill="#818cf8"
        />

        <text
            x="137"
            y="225"
            font-size="38"
            text-anchor="middle"
        >
            ⏰
        </text>

        <text
            x="137"
            y="360"
            font-size="20"
            text-anchor="middle"
            fill="#172033"
        >
            Sound Waves
        </text>

    </g>


    <!-- WALKING -->

    <g>

        <circle
            cx="375"
            cy="180"
            r="33"
            fill="#f59e0b"
        />

        <line
            x1="375"
            y1="212"
            x2="375"
            y2="280"
            stroke="#172033"
            stroke-width="12"
            stroke-linecap="round"
        />

        <line
            x1="375"
            y1="235"
            x2="330"
            y2="265"
            stroke="#172033"
            stroke-width="10"
            stroke-linecap="round"
        />

        <line
            x1="375"
            y1="235"
            x2="420"
            y2="255"
            stroke="#172033"
            stroke-width="10"
            stroke-linecap="round"
        />

        <line
            x1="375"
            y1="280"
            x2="340"
            y2="330"
            stroke="#172033"
            stroke-width="10"
            stroke-linecap="round"
        />

        <line
            x1="375"
            y1="280"
            x2="420"
            y2="320"
            stroke="#172033"
            stroke-width="10"
            stroke-linecap="round"
        />

        <text
            x="375"
            y="360"
            font-size="20"
            text-anchor="middle"
            fill="#172033"
        >
            Friction
        </text>

    </g>


    <!-- CAR -->

    <g id="car">

        <animateTransform
            attributeName="transform"
            type="translate"
            values="0 0;45 0;0 0"
            dur="3s"
            repeatCount="indefinite"
        />

        <rect
            x="585"
            y="215"
            width="210"
            height="75"
            rx="25"
            fill="#4f46e5"
        />

        <path
            d="M630 215 L675 165 L735 165 L775 215"
            fill="#6366f1"
        />

        <circle
            cx="635"
            cy="295"
            r="28"
            fill="#111827"
        />

        <circle
            cx="750"
            cy="295"
            r="28"
            fill="#111827"
        />

    </g>


    <text
        x="690"
        y="360"
        font-size="20"
        text-anchor="middle"
        fill="#172033"
    >
        Motion &amp; Force
    </text>


    <!-- SUN / LIGHT -->

    <circle
        cx="885"
        cy="145"
        r="48"
        fill="#fbbf24"
    >

        <animate
            attributeName="r"
            values="43;52;43"
            dur="2s"
            repeatCount="indefinite"
        />

    </circle>


    <text
        x="885"
        y="230"
        font-size="20"
        text-anchor="middle"
        fill="#172033"
    >
        Light &amp; Energy
    </text>

</svg>
