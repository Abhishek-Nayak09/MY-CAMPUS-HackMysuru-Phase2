
<svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 1000 430"
>

    <rect
        width="1000"
        height="430"
        rx="28"
        fill="#111827"
    />


    <circle
        cx="90"
        cy="85"
        r="3"
        fill="white"
    />

    <circle
        cx="170"
        cy="160"
        r="4"
        fill="white"
    />

    <circle
        cx="850"
        cy="110"
        r="4"
        fill="white"
    />

    <circle
        cx="760"
        cy="230"
        r="3"
        fill="white"
    />


    <text
        x="50"
        y="60"
        font-size="32"
        font-family="Arial"
        font-weight="700"
        fill="white"
    >
        Newton's Third Law in a Rocket
    </text>


    <g id="rocket">

        <animateTransform
            attributeName="transform"
            type="translate"
            values="0 20;0 -20;0 20"
            dur="2.5s"
            repeatCount="indefinite"
        />


        <path
            d="M500 115
               C455 165 450 235 500 300
               C550 235 545 165 500 115"
            fill="#e5e7eb"
        />


        <circle
            cx="500"
            cy="195"
            r="24"
            fill="#60a5fa"
        />


        <polygon
            points="470,270 445,320 485,300"
            fill="#ef4444"
        />


        <polygon
            points="530,270 555,320 515,300"
            fill="#ef4444"
        />


        <polygon
            points="480,300 500,385 520,300"
            fill="#f59e0b"
        >

            <animate
                attributeName="points"
                values="
                    480,300 500,365 520,300;
                    480,300 500,400 520,300;
                    480,300 500,365 520,300
                "
                dur="0.5s"
                repeatCount="indefinite"
            />

        </polygon>

    </g>


    <line
        x1="650"
        y1="285"
        x2="650"
        y2="155"
        stroke="#22c55e"
        stroke-width="8"
    />


    <polygon
        points="650,140 635,170 665,170"
        fill="#22c55e"
    />


    <text
        x="680"
        y="210"
        font-size="20"
        fill="#86efac"
    >
        Reaction: Rocket moves UP
    </text>


    <line
        x1="350"
        y1="180"
        x2="350"
        y2="325"
        stroke="#f97316"
        stroke-width="8"
    />


    <polygon
        points="350,340 335,310 365,310"
        fill="#f97316"
    />


    <text
        x="70"
        y="280"
        font-size="20"
        fill="#fdba74"
    >
        Action: Exhaust gases pushed DOWN
    </text>

</svg>
