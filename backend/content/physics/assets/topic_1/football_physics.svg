
<svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 1000 420"
>

    <rect
        width="1000"
        height="420"
        rx="28"
        fill="#ecfdf5"
    />


    <text
        x="50"
        y="60"
        font-size="32"
        font-family="Arial"
        font-weight="700"
        fill="#172033"
    >
        Physics of a Football Kick
    </text>


    <path
        d="M120 320 Q450 70 800 285"
        fill="none"
        stroke="#6366f1"
        stroke-width="5"
        stroke-dasharray="12 12"
    />


    <circle
        r="28"
        fill="#ffffff"
        stroke="#111827"
        stroke-width="4"
    >

        <animateMotion
            dur="4s"
            repeatCount="indefinite"
            path="M120 320 Q450 70 800 285"
        />

    </circle>


    <!-- FORCE -->

    <line
        x1="125"
        y1="305"
        x2="245"
        y2="245"
        stroke="#dc2626"
        stroke-width="8"
    />

    <polygon
        points="245,245 220,245 232,265"
        fill="#dc2626"
    />


    <text
        x="185"
        y="225"
        font-size="20"
        fill="#dc2626"
    >
        Force
    </text>


    <!-- GRAVITY -->

    <line
        x1="500"
        y1="135"
        x2="500"
        y2="255"
        stroke="#2563eb"
        stroke-width="8"
    />

    <polygon
        points="500,270 485,242 515,242"
        fill="#2563eb"
    />


    <text
        x="520"
        y="205"
        font-size="20"
        fill="#2563eb"
    >
        Gravity
    </text>


    <text
        x="120"
        y="380"
        font-size="19"
        fill="#172033"
    >
        Kick → Force → Motion → Gravity → Curved Path
    </text>

</svg>
