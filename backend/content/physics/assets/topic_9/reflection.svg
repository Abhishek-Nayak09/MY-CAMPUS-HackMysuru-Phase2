
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470">

    <rect
        width="1000"
        height="470"
        rx="28"
        fill="#eef2ff"
    />

    <text
        x="45"
        y="60"
        font-family="Arial"
        font-size="32"
        font-weight="700"
        fill="#172033"
    >
        Reflection of Light
    </text>

    <!-- MIRROR -->

    <line
        x1="500"
        y1="115"
        x2="500"
        y2="390"
        stroke="#475569"
        stroke-width="12"
    />

    <text
        x="520"
        y="140"
        font-family="Arial"
        font-size="20"
        fill="#475569"
    >
        Mirror
    </text>

    <!-- NORMAL -->

    <line
        x1="290"
        y1="250"
        x2="710"
        y2="250"
        stroke="#94a3b8"
        stroke-width="4"
        stroke-dasharray="12 10"
    />

    <text
        x="685"
        y="230"
        font-family="Arial"
        font-size="18"
        fill="#64748b"
    >
        Normal
    </text>

    <!-- INCIDENT RAY -->

    <line
        x1="160"
        y1="110"
        x2="490"
        y2="245"
        stroke="#ef4444"
        stroke-width="8"
    />

    <polygon
        points="500,250 474,224 472,255"
        fill="#ef4444"
    />

    <text
        x="190"
        y="125"
        font-family="Arial"
        font-size="20"
        fill="#b91c1c"
    >
        Incident Ray
    </text>

    <!-- REFLECTED RAY -->

    <line
        x1="505"
        y1="245"
        x2="835"
        y2="110"
        stroke="#2563eb"
        stroke-width="8"
    />

    <polygon
        points="850,103 817,100 829,128"
        fill="#2563eb"
    />

    <text
        x="680"
        y="125"
        font-family="Arial"
        font-size="20"
        fill="#1d4ed8"
    >
        Reflected Ray
    </text>

    <text
        x="280"
        y="420"
        font-family="Arial"
        font-size="24"
        font-weight="700"
        fill="#4338ca"
    >
        Angle of Incidence = Angle of Reflection
    </text>

</svg>
