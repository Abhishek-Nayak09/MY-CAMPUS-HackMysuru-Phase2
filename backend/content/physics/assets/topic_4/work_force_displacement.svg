
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430">

    <rect
        width="1000"
        height="430"
        rx="28"
        fill="#eef2ff"
    />

    <text
        x="45"
        y="60"
        font-family="Arial"
        font-size="32"
        font-weight="700"
        fill="#172033"
    >
        Work = Force + Displacement
    </text>

    <!-- FLOOR -->

    <line
        x1="80"
        y1="330"
        x2="920"
        y2="330"
        stroke="#64748b"
        stroke-width="8"
    />

    <!-- BOX -->

    <g>

        <animateTransform
            attributeName="transform"
            type="translate"
            values="0 0;380 0;0 0"
            dur="5s"
            repeatCount="indefinite"
        />

        <rect
            x="180"
            y="235"
            width="130"
            height="90"
            rx="12"
            fill="#6366f1"
        />

        <text
            x="245"
            y="290"
            font-family="Arial"
            font-size="21"
            text-anchor="middle"
            fill="white"
        >
            BOX
        </text>

    </g>

    <!-- FORCE ARROW -->

    <line
        x1="90"
        y1="275"
        x2="165"
        y2="275"
        stroke="#dc2626"
        stroke-width="9"
    />

    <polygon
        points="180,275 150,255 150,295"
        fill="#dc2626"
    />

    <text
        x="85"
        y="240"
        font-family="Arial"
        font-size="21"
        fill="#dc2626"
    >
        Force
    </text>

    <!-- DISPLACEMENT -->

    <line
        x1="330"
        y1="185"
        x2="700"
        y2="185"
        stroke="#16a34a"
        stroke-width="8"
    />

    <polygon
        points="720,185 685,165 685,205"
        fill="#16a34a"
    />

    <text
        x="425"
        y="155"
        font-family="Arial"
        font-size="21"
        fill="#15803d"
    >
        Displacement
    </text>

    <text
        x="325"
        y="390"
        font-family="Arial"
        font-size="22"
        font-weight="700"
        fill="#172033"
    >
        W = F × s   when force and motion are in the same direction
    </text>

</svg>
