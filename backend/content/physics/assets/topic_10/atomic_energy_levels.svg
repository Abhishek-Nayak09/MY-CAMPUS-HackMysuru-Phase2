
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470">

    <rect
        width="1000"
        height="470"
        rx="28"
        fill="#eef2ff"
    />

    <text
        x="45"
        y="60"
        font-family="Arial"
        font-size="32"
        font-weight="700"
        fill="#172033"
    >
        Electrons Occupy Discrete Energy Levels
    </text>

    <!-- NUCLEUS -->

    <circle
        cx="500"
        cy="245"
        r="42"
        fill="#ef4444"
    />

    <text
        x="500"
        y="253"
        text-anchor="middle"
        font-family="Arial"
        font-size="20"
        font-weight="700"
        fill="white"
    >
        Nucleus
    </text>

    <!-- ORBITS -->

    <ellipse
        cx="500"
        cy="245"
        rx="140"
        ry="80"
        fill="none"
        stroke="#6366f1"
        stroke-width="4"
    />

    <ellipse
        cx="500"
        cy="245"
        rx="240"
        ry="140"
        fill="none"
        stroke="#8b5cf6"
        stroke-width="4"
    />

    <!-- ELECTRON -->

    <circle
        r="14"
        fill="#2563eb"
    >
        <animateMotion
            dur="3s"
            repeatCount="indefinite"
            path="M640 245
                  A140 80 0 1 1 360 245
                  A140 80 0 1 1 640 245"
        />
    </circle>

    <circle
        r="14"
        fill="#16a34a"
    >
        <animateMotion
            dur="5s"
            repeatCount="indefinite"
            path="M740 245
                  A240 140 0 1 1 260 245
                  A240 140 0 1 1 740 245"
        />
    </circle>

    <text
        x="255"
        y="425"
        font-family="Arial"
        font-size="23"
        font-weight="700"
        fill="#4338ca"
    >
        Electrons can change energy levels by absorbing or emitting energy
    </text>

</svg>
