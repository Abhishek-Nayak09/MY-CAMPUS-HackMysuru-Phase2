
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430">

    <rect
        width="1000"
        height="430"
        rx="28"
        fill="#eef2ff"
    />

    <text
        x="45"
        y="60"
        font-family="Arial"
        font-size="32"
        font-weight="700"
        fill="#172033"
    >
        Force Can Change Motion
    </text>

    <!-- BOX -->

    <g id="box">

        <animateTransform
            attributeName="transform"
            type="translate"
            values="0 0;360 0;0 0"
            dur="5s"
            repeatCount="indefinite"
        />

        <rect
            x="180"
            y="230"
            width="130"
            height="100"
            rx="12"
            fill="#6366f1"
        />

        <text
            x="245"
            y="290"
            font-family="Arial"
            font-size="22"
            text-anchor="middle"
            fill="white"
        >
            BOX
        </text>

    </g>

    <!-- FORCE ARROW -->

    <line
        x1="80"
        y1="280"
        x2="160"
        y2="280"
        stroke="#dc2626"
        stroke-width="10"
    />

    <polygon
        points="175,280 145,260 145,300"
        fill="#dc2626"
    />

    <text
        x="80"
        y="245"
        font-family="Arial"
        font-size="22"
        fill="#dc2626"
    >
        PUSH
    </text>

    <!-- ROAD -->

    <line
        x1="80"
        y1="335"
        x2="900"
        y2="335"
        stroke="#64748b"
        stroke-width="8"
    />

    <text
        x="350"
        y="390"
        font-family="Arial"
        font-size="22"
        fill="#172033"
    >
        Net Force → Acceleration → Change in Motion
    </text>

</svg>
