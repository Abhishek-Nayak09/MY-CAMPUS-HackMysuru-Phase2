
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430">

    <rect
        width="1000"
        height="430"
        rx="28"
        fill="#fff7ed"
    />

    <text
        x="45"
        y="60"
        font-family="Arial"
        font-size="32"
        font-weight="700"
        fill="#172033"
    >
        Collision — Momentum Transfers Between Objects
    </text>

    <!-- BALL 1 -->

    <circle
        cx="250"
        cy="235"
        r="50"
        fill="#2563eb"
    >

        <animate
            attributeName="cx"
            values="250;450;450"
            dur="3s"
            repeatCount="indefinite"
        />

    </circle>

    <!-- BALL 2 -->

    <circle
        cx="580"
        cy="235"
        r="50"
        fill="#ef4444"
    >

        <animate
            attributeName="cx"
            values="580;580;760"
            dur="3s"
            repeatCount="indefinite"
        />

    </circle>

    <!-- ARROW -->

    <line
        x1="120"
        y1="140"
        x2="330"
        y2="140"
        stroke="#16a34a"
        stroke-width="8"
    />

    <polygon
        points="350,140 315,120 315,160"
        fill="#16a34a"
    />

    <text
        x="140"
        y="115"
        font-family="Arial"
        font-size="20"
        fill="#15803d"
    >
        Initial motion
    </text>

    <text
        x="230"
        y="365"
        font-family="Arial"
        font-size="21"
        fill="#172033"
    >
        Before collision
    </text>

    <text
        x="625"
        y="365"
        font-family="Arial"
        font-size="21"
        fill="#172033"
    >
        After collision
    </text>

</svg>
