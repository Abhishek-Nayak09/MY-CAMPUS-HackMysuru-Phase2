
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430">

    <rect
        width="1000"
        height="430"
        rx="28"
        fill="#ecfdf5"
    />

    <text
        x="45"
        y="60"
        font-family="Arial"
        font-size="32"
        font-weight="700"
        fill="#172033"
    >
        Speed vs Velocity
    </text>

    <!-- ROAD -->

    <line
        x1="80"
        y1="290"
        x2="910"
        y2="290"
        stroke="#64748b"
        stroke-width="8"
    />

    <line
        x1="80"
        y1="315"
        x2="910"
        y2="315"
        stroke="#cbd5e1"
        stroke-width="5"
        stroke-dasharray="25 20"
    />

    <!-- CAR -->

    <g>

        <animateTransform
            attributeName="transform"
            type="translate"
            values="0 0;500 0;0 0"
            dur="5s"
            repeatCount="indefinite"
        />

        <rect
            x="120"
            y="220"
            width="190"
            height="65"
            rx="22"
            fill="#4f46e5"
        />

        <circle
            cx="160"
            cy="290"
            r="24"
            fill="#111827"
        />

        <circle
            cx="270"
            cy="290"
            r="24"
            fill="#111827"
        />

    </g>

    <!-- DIRECTION ARROW -->

    <line
        x1="380"
        y1="150"
        x2="650"
        y2="150"
        stroke="#dc2626"
        stroke-width="8"
    />

    <polygon
        points="670,150 635,130 635,170"
        fill="#dc2626"
    />

    <text
        x="390"
        y="125"
        font-family="Arial"
        font-size="21"
        fill="#dc2626"
    >
        Direction matters for Velocity
    </text>

    <text
        x="100"
        y="390"
        font-family="Arial"
        font-size="20"
        fill="#172033"
    >
        Speed = how fast
    </text>

    <text
        x="580"
        y="390"
        font-family="Arial"
        font-size="20"
        fill="#172033"
    >
        Velocity = how fast + direction
    </text>

</svg>
