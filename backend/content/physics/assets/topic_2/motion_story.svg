
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430">

    <rect
        width="1000"
        height="430"
        rx="28"
        fill="#fff7ed"
    />

    <text
        x="45"
        y="60"
        font-family="Arial"
        font-size="32"
        font-weight="700"
        fill="#172033"
    >
        Your Journey to College
    </text>

    <!-- HOUSE -->

    <rect
        x="90"
        y="220"
        width="130"
        height="110"
        fill="#60a5fa"
    />

    <polygon
        points="70,220 155,150 240,220"
        fill="#2563eb"
    />

    <text
        x="115"
        y="365"
        font-family="Arial"
        font-size="20"
        fill="#172033"
    >
        Home
    </text>

    <!-- COLLEGE -->

    <rect
        x="770"
        y="175"
        width="150"
        height="155"
        fill="#a78bfa"
    />

    <rect
        x="825"
        y="260"
        width="40"
        height="70"
        fill="#4c1d95"
    />

    <text
        x="795"
        y="365"
        font-family="Arial"
        font-size="20"
        fill="#172033"
    >
        College
    </text>

    <!-- ROAD -->

    <path
        d="M220 290 Q500 110 770 280"
        fill="none"
        stroke="#64748b"
        stroke-width="16"
    />

    <!-- MOVING CAR -->

    <g>

        <animateMotion
            dur="5s"
            repeatCount="indefinite"
            path="M220 260 Q500 80 740 250"
        />

        <rect
            x="0"
            y="0"
            width="100"
            height="40"
            rx="14"
            fill="#ef4444"
        />

        <circle
            cx="22"
            cy="42"
            r="13"
            fill="#111827"
        />

        <circle
            cx="78"
            cy="42"
            r="13"
            fill="#111827"
        />

    </g>

    <text
        x="335"
        y="390"
        font-family="Arial"
        font-size="20"
        fill="#172033"
    >
        Position changes with time → Motion
    </text>

</svg>
