
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470">

    <rect
        width="1000"
        height="470"
        rx="28"
        fill="#ecfdf5"
    />

    <text
        x="45"
        y="60"
        font-family="Arial"
        font-size="32"
        font-weight="700"
        fill="#172033"
    >
        Electric Current Can Create Magnetism
    </text>

    <!-- IRON CORE -->

    <rect
        x="250"
        y="185"
        width="500"
        height="90"
        rx="20"
        fill="#64748b"
    />

    <text
        x="500"
        y="240"
        text-anchor="middle"
        font-family="Arial"
        font-size="22"
        fill="white"
    >
        Iron Core
    </text>

    <!-- COIL -->

    <g
        fill="none"
        stroke="#f59e0b"
        stroke-width="12"
    >

        <ellipse cx="300" cy="230" rx="24" ry="80"/>
        <ellipse cx="355" cy="230" rx="24" ry="80"/>
        <ellipse cx="410" cy="230" rx="24" ry="80"/>
        <ellipse cx="465" cy="230" rx="24" ry="80"/>
        <ellipse cx="520" cy="230" rx="24" ry="80"/>
        <ellipse cx="575" cy="230" rx="24" ry="80"/>
        <ellipse cx="630" cy="230" rx="24" ry="80"/>
        <ellipse cx="685" cy="230" rx="24" ry="80"/>

    </g>

    <!-- CURRENT INDICATOR -->

    <circle
        r="10"
        fill="#ef4444"
    >
        <animateMotion
            dur="2.5s"
            repeatCount="indefinite"
            path="M235 145 L760 145"
        />
    </circle>

    <line
        x1="235"
        y1="145"
        x2="760"
        y2="145"
        stroke="#ef4444"
        stroke-width="5"
    />

    <text
        x="400"
        y="120"
        font-family="Arial"
        font-size="20"
        fill="#b91c1c"
    >
        Electric Current
    </text>

    <!-- POLES -->

    <text
        x="205"
        y="240"
        font-family="Arial"
        font-size="30"
        font-weight="700"
        fill="#dc2626"
    >
        N
    </text>

    <text
        x="790"
        y="240"
        font-family="Arial"
        font-size="30"
        font-weight="700"
        fill="#2563eb"
    >
        S
    </text>

    <text
        x="205"
        y="390"
        font-family="Arial"
        font-size="23"
        font-weight="700"
        fill="#15803d"
    >
        Current through coil → Magnetic field → Electromagnet
    </text>

</svg>
