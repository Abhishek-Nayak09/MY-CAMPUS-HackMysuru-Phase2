name: Fresh installation and content

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fresh-install-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fresh-install:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONPATH: backend
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install committed requirements into a clean runner
        run: python -m pip install -r requirements.txt
      - name: Verify startup creates content without seed commands
        run: python scripts/verify_fresh_install.py
      - name: Initialization, content, auth and randomized-quiz tests
        run: python -m unittest discover -s backend/tests -p test_initialization.py -v
      - name: Prepare default database for the existing faculty integration test
        run: python setup_demo.py
      - name: Faculty resource and ticket regression checks
        run: python -X utf8 backend/tests/test_faculty_hub.py
      - name: Windows one-click setup and repeat-start verification
        if: runner.os == 'Windows'
        shell: powershell
        timeout-minutes: 5
        run: |
          try {
            .\setup_my_campus.ps1
            if ($LASTEXITCODE -ne 0) { throw 'Windows setup failed' }
            .\start_my_campus.ps1 -NoBrowser
            if ($LASTEXITCODE -ne 0) { throw 'First Windows startup failed' }
            $before = Invoke-RestMethod http://127.0.0.1:8000/health
            .\start_my_campus.ps1 -NoBrowser
            if ($LASTEXITCODE -ne 0) { throw 'Repeat Windows startup failed' }
            $after = Invoke-RestMethod http://127.0.0.1:8000/health
            if (-not $after.content.ready -or $before.process_id -ne $after.process_id) {
              throw 'Repeat launch must reuse the same initialized backend.'
            }
          } finally {
            # Only this dedicated runner's test servers use these module/port pairs.
            Get-CimInstance Win32_Process | Where-Object {
              $_.Name -match '^python' -and
              $_.CommandLine -match 'uvicorn.+--port 8000\b|http.server 5500\b'
            } | ForEach-Object { Stop-Process -Id $_.ProcessId -ErrorAction SilentlyContinue }
          }
