services:
  - type: web
    name: my-campus-api
    runtime: python
    plan: free
    region: singapore

    buildCommand: pip install -r requirements.txt

    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT

    healthCheckPath: /health

    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: my-campus-db
          property: connectionString

databases:
  - name: my-campus-db
    plan: free
    region: singapore